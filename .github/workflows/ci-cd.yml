name: Flask CI/CD

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_student_db
          SECRET_KEY: github-actions-test-secret
        run: |
          pytest -v

      - name: Build application
        run: |
          python -m compileall app.py

  deploy-staging:
    name: Deploy to Staging
    needs: build-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create staging deployment package
        run: |
          zip -r staging-deployment.zip . \
            -x ".git/*" \
               "screenshots/*" \
               ".github/*" \
               "__pycache__/*" \
               ".pytest_cache/*"

      - name: Upload staging deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment
          path: staging-deployment.zip

  deploy-production:
    name: Deploy to Production
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create production deployment package
        run: |
          zip -r production-deployment.zip . \
            -x ".git/*" \
               "screenshots/*" \
               ".github/*" \
               "__pycache__/*" \
               ".pytest_cache/*"

      - name: Upload production deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment
          path: production-deployment.zip